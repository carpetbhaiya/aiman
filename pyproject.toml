[project]
name = "aiman"
version = "0.1.0"
description = "AI-assisted man page, command generator, and command safety checker"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "ollama>=0.4.0",
    "pyfiglet>=1.0.2",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
aiman = "aiman.cli:run_app"
ai = "aiman.cli:run_app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiman*"]
